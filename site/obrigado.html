<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mensagem enviada · Liliana Pinto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%236B1E2E' stroke='%23E3CB94' stroke-width='2'/%3E%3Ctext x='19' y='42' font-family='Georgia,serif' font-size='30' fill='%23F7F5F0'%3EL%3C/text%3E%3Ctext x='33' y='47' font-family='Georgia,serif' font-size='30' fill='%23E3CB94'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Montserrat:wght@400;700&display=swap">
<style>
:root{--bordo:#6B1E2E;--gold:#B08A3E;--ivory:#F7F5F0;--ink:#2A1A1E;--muted:#6E5A5F;--line:rgba(176,138,62,.45);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ivory);color:var(--ink);font:15px/1.65 "Montserrat","Helvetica Neue",Arial,sans-serif;padding:24px}
.card{max-width:560px;width:100%;border:1px solid var(--line);padding:clamp(28px,6vw,56px);text-align:center;background:#FBFAF7}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0}
h1{font-family:"Cormorant Garamond",Garamond,serif;font-weight:600;font-size:clamp(34px,6vw,48px);line-height:1.05;color:var(--bordo);margin:12px 0 16px}
h1 em{font-style:italic;font-weight:500;color:var(--gold);display:block}
p{color:var(--muted);margin:0 0 10px}
.btn{display:inline-block;margin-top:22px;padding:14px 24px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;background:var(--bordo);color:var(--ivory);border:1px solid var(--bordo)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
<script src="/analytics.js" defer></script>
</head>
<body>
<main class="card">
 <p class="eyebrow">Mensagem enviada</p>
 <h1>Obrigada pelo contacto. <em>Respondo ainda hoje.</em></h1>
 <p>Thank you, I'll get back to you today. · Merci, je vous réponds aujourd'hui.</p>
 <p>Se for urgente, ligue ou envie WhatsApp para o 934 263 986.</p>
 <a class="btn" href="/">Voltar ao site</a>
</main>
</body>
</html>
